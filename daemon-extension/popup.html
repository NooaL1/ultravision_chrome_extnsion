<!doctype html>
<meta charset="utf-8">
<title>Daemon</title>
<style>
  body { width: 260px; margin: 0; padding: 14px;
    background: #0b0d10; color: #e6e6e6;
    font: 14px -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 13px; margin: 0 0 8px; opacity: .55; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase; }
  .group { margin-bottom: 10px; }
  button { display: block; width: 100%; margin: 5px 0;
    padding: 10px 12px; border-radius: 6px; border: 0;
    background: #2a6df4; color: #fff; cursor: pointer;
    font-size: 13px; text-align: left; }
  button.alt  { background: #2d3138; }
  button.lect { background: linear-gradient(135deg, #ff4d6d, #a78bfa);
    font-weight: 600; }
  .status { font-size: 11px; opacity: .7; margin-top: 8px;
    padding: 8px; background: #15181c; border-radius: 6px;
    font-variant-numeric: tabular-nums; line-height: 1.6; }
</style>
<h1>ENGINE</h1>
<div class="group">
  <button id="start">▶ Käynnistä</button>
  <button id="cal" class="alt">⊕ Kalibroi katse</button>
  <button id="stop" class="alt">■ Pysäytä</button>
</div>
<h1>LUENTOTILA</h1>
<div class="group">
  <button id="lecture" class="lect">🎓 Aloita luento-istunto</button>
  <button id="sessions" class="alt">📁 Aiemmat istunnot</button>
</div>
<div class="status" id="status">…</div>
