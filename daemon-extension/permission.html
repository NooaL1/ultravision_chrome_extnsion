<!doctype html>
<meta charset="utf-8">
<title>Daemon — kameralupa</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e6e6e6;
    font: 16px -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; }
  .box { max-width: 460px; padding: 32px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { opacity: .7; line-height: 1.5; }
  button { margin-top: 16px; padding: 12px 24px; font-size: 15px;
    background: #2a6df4; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
  .err { color: #ff6b6b; margin-top: 16px; }
  .ok  { color: #51cf66; margin-top: 16px; }
  code { background: #1a1d22; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>
<div class="box">
  <h1>Daemon tarvitsee kameran</h1>
  <p>Daemon analysoi sykkeesi ja katseesi suoraan webcamin kuvasta — kuvaa ei lähetetä mihinkään, kaikki tapahtuu paikallisesti selaimessasi.</p>
  <button id="grant">Salli kamera</button>
  <div id="status"></div>
</div>
